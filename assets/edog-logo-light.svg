<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 140" fill="none">
  <defs>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6C5CE7"/>
      <stop offset="100%" stop-color="#3B7DDD"/>
    </linearGradient>
    <linearGradient id="earGrad" x1="0" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#8B7AFF"/>
      <stop offset="100%" stop-color="#5B4CD7"/>
    </linearGradient>
  </defs>

  <!-- Geometric Dog Mark -->
  <g transform="translate(12, 8)">
    <!-- Left ear -->
    <path d="M28 6 L14 50 L42 42 Z" fill="url(#earGrad)" opacity="0.9"/>
    <!-- Right ear -->
    <path d="M86 6 L72 42 L100 50 Z" fill="url(#earGrad)" opacity="0.9"/>
    <!-- Head — hexagonal shield -->
    <path d="M22 38 L57 22 L92 38 L100 70 L92 102 L57 118 L22 102 L14 70 Z" fill="url(#accentGrad)"/>
    <!-- Snout -->
    <path d="M42 78 L57 98 L72 78 Z" fill="#FFFFFF" opacity="0.5"/>
    <!-- Left eye -->
    <circle cx="40" cy="62" r="5.5" fill="#FFFFFF"/>
    <circle cx="41.5" cy="61" r="2.5" fill="#1E1E2E"/>
    <!-- Right eye -->
    <circle cx="74" cy="62" r="5.5" fill="#FFFFFF"/>
    <circle cx="75.5" cy="61" r="2.5" fill="#1E1E2E"/>
    <!-- Nose -->
    <circle cx="57" cy="84" r="3" fill="#1E1E2E" opacity="0.7"/>
    <!-- Terminal cursor -->
    <rect x="49" y="44" width="16" height="2.5" rx="1" fill="#FFFFFF" opacity="0.85">
      <animate attributeName="opacity" values="0.85;0.15;0.85" dur="1.2s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- EDOG Text -->
  <g transform="translate(136, 28)" fill="#1A1A2E">
    <!-- E -->
    <rect x="0" y="0" width="7" height="50" rx="1.5"/>
    <rect x="0" y="0" width="30" height="7" rx="1.5"/>
    <rect x="0" y="21.5" width="22" height="7" rx="1.5"/>
    <rect x="0" y="43" width="30" height="7" rx="1.5"/>
    <!-- D -->
    <rect x="40" y="0" width="7" height="50" rx="1.5"/>
    <rect x="40" y="0" width="22" height="7" rx="1.5"/>
    <rect x="40" y="43" width="22" height="7" rx="1.5"/>
    <rect x="62" y="7" width="7" height="36" rx="1.5"/>
    <!-- O -->
    <rect x="80" y="0" width="7" height="50" rx="1.5"/>
    <rect x="80" y="0" width="30" height="7" rx="1.5"/>
    <rect x="80" y="43" width="30" height="7" rx="1.5"/>
    <rect x="103" y="0" width="7" height="50" rx="1.5"/>
    <!-- G -->
    <rect x="120" y="0" width="7" height="50" rx="1.5"/>
    <rect x="120" y="0" width="30" height="7" rx="1.5"/>
    <rect x="120" y="43" width="30" height="7" rx="1.5"/>
    <rect x="143" y="25" width="7" height="25" rx="1.5"/>
    <rect x="136" y="25" width="14" height="7" rx="1.5"/>
  </g>

  <!-- Accent line separator -->
  <rect x="136" y="84" width="150" height="1.5" rx="0.75" fill="url(#accentGrad)" opacity="0.5"/>

  <!-- DevMode subtitle -->
  <text x="136" y="104" fill="#6C5CE7" font-family="'Consolas','SF Mono','Menlo',monospace" font-size="13" font-weight="600" letter-spacing="5">DevMode</text>
</svg>
