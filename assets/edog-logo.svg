<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 160" width="480" height="160">
  <defs>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6C63FF"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="markGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818CF8"/>
      <stop offset="50%" stop-color="#6C63FF"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>
    <clipPath id="shieldClip">
      <path d="M12,8 L60,8 C64.4,8 68,11.6 68,16 L68,52 C68,58 64,64 60,68 L40,80 L20,68 C16,64 12,58 12,52 L12,16 C12,11.6 15.6,8 20,8 Z"/>
    </clipPath>
  </defs>

  <!-- === LOGO MARK: Geometric Dog in Shield === -->
  <g transform="translate(16, 0)">
    <!-- Shield container -->
    <path d="M12,8 L60,8 C64.4,8 68,11.6 68,16 L68,52 C68,58 64,64 60,68 L40,80 L20,68 C16,64 12,58 12,52 L12,16 C12,11.6 15.6,8 20,8 Z"
          fill="url(#markGrad)" opacity="0.12"/>
    <path d="M12,8 L60,8 C64.4,8 68,11.6 68,16 L68,52 C68,58 64,64 60,68 L40,80 L20,68 C16,64 12,58 12,52 L12,16 C12,11.6 15.6,8 20,8 Z"
          fill="none" stroke="url(#markGrad)" stroke-width="1.5" opacity="0.4"/>

    <!-- Geometric dog head — abstract angular construction -->
    <!-- Left ear -->
    <path d="M24,36 L30,18 L36,32 Z" fill="url(#accentGrad)" opacity="0.9"/>
    <!-- Right ear -->
    <path d="M56,36 L50,18 L44,32 Z" fill="url(#accentGrad)" opacity="0.9"/>
    <!-- Head — faceted polygon -->
    <path d="M28,34 L34,28 L46,28 L52,34 L54,44 L50,54 L40,60 L30,54 L26,44 Z"
          fill="url(#accentGrad)" opacity="0.85"/>
    <!-- Muzzle highlight -->
    <path d="M35,46 L40,42 L45,46 L43,52 L40,54 L37,52 Z"
          fill="#ffffff" opacity="0.15"/>
    <!-- Left eye — angular diamond -->
    <path d="M33,38 L35,35 L37,38 L35,40 Z" fill="#ffffff" opacity="0.95"/>
    <!-- Right eye — angular diamond -->
    <path d="M43,38 L45,35 L47,38 L45,40 Z" fill="#ffffff" opacity="0.95"/>
    <!-- Nose — small inverted triangle -->
    <path d="M38.5,47 L41.5,47 L40,49.5 Z" fill="#ffffff" opacity="0.7"/>
    <!-- Collar / terminal prompt accent -->
    <line x1="32" y1="56" x2="48" y2="56" stroke="#818CF8" stroke-width="1.2" opacity="0.5" stroke-linecap="round"/>
    <!-- Cursor blink on collar -->
    <rect x="46" y="54.5" width="1.5" height="3" rx="0.5" fill="#818CF8" opacity="0.6"/>
  </g>

  <!-- === WORDMARK: EDOG === -->
